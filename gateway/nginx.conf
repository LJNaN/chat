# 统一网关：独占 80 端口，按路径把请求分发到各个项目
# 新增项目时，只需在这里加一段 location，并把它接入 web 网络
#
# 注意：proxy_pass 这里刻意写成变量形式。
# nginx 对 proxy_pass 里的字面主机名是"启动时解析一次"，任何一个项目没起
# 都会导致网关直接启动失败，且对方容器重建换 IP 后会一直连不上。
# 改用变量 + Docker 内置 DNS 后，解析推迟到请求时，各自互不影响。

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50M;

    # 根路径暂时导向对话应用
    location = / {
        return 302 /chat/;
    }

    # ============ 弦集（guitar） ============

    location = /guitar {
        return 301 /guitar/;
    }

    location /guitar/ {
        set $upstream http://xianji-web:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /guitar-api/ {
        set $upstream http://xianji-api:5000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /guitar-images/ {
        set $upstream http://xianji-api:5000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============ 对话（chat） ============

    location = /chat {
        return 301 /chat/;
    }

    location /chat/ {
        set $upstream http://chat-frontend:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE 流式接口：必须关闭缓冲，否则回复会攒成一坨再返回，看不到打字机效果
    location /chat-api/ {
        set $upstream http://chat-backend:5001;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }
}
