services:
  # ---- Node.js API 后端（不直接对外，只走网关） ----
  chat-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - DEEPSEEK_KEY=${DEEPSEEK_KEY}
      - CHAT_PASSWORD=${CHAT_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./server/data:/app/data
    restart: unless-stopped
    networks:
      default:
      web:
        # 供统一网关（gateway 仓库）按此别名转发 /chat-api
        aliases:
          - chat-api

  # ---- 前端 Nginx（托管静态文件，由统一网关转发 /chat/） ----
  # 本项目不发布任何宿主机端口，80 由 gateway 仓库独占
  chat-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - chat-backend
    restart: unless-stopped
    networks:
      default:
      web:
        # 供统一网关（gateway 仓库）按此别名转发 /chat/
        aliases:
          - chat-web

networks:
  # 与 xianji 等项目共享的外部网络，需先 docker network create web
  web:
    external: true
